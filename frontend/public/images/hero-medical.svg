<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background fluid shape -->
  <path d="M100,300 C100,100 300,50 500,100 C700,150 750,300 700,500 C650,700 400,650 200,550 C0,450 100,300 100,300 Z" fill="url(#bgGrad)" />
  
  <!-- Desk -->
  <path d="M150,450 L650,450 L700,550 L100,550 Z" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="150" y="450" width="500" height="20" fill="#e2e8f0"/>

  <!-- Doctor Character -->
  <!-- Body -->
  <path d="M480,220 C480,180 520,150 560,150 C600,150 640,180 640,220 L660,450 L460,450 Z" fill="#f8fafc"/>
  <path d="M480,220 L560,320 L640,220" fill="none" stroke="#e2e8f0" stroke-width="6"/> <!-- Coat lapels -->
  <!-- Stethoscope -->
  <path d="M520,240 C520,280 600,280 600,240" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <path d="M560,270 L560,350" fill="none" stroke="#334155" stroke-width="8"/>
  <circle cx="560" cy="360" r="12" fill="#334155"/>
  <!-- Head -->
  <circle cx="560" cy="130" r="45" fill="#fcd34d"/> <!-- Skin tone -->
  <path d="M515,130 C515,90 560,70 605,130" fill="#334155"/> <!-- Hair -->
  
  <!-- Patient Character -->
  <!-- Body -->
  <path d="M220,280 C220,240 260,220 300,220 C340,220 380,240 380,280 L400,450 L200,450 Z" fill="#38bdf8"/>
  <!-- Head -->
  <circle cx="300" cy="190" r="40" fill="#fcd34d"/>
  <path d="M260,190 C260,150 300,140 340,190" fill="#78350f"/>

  <!-- Computer Screen on desk -->
  <rect x="350" y="320" width="160" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <rect x="410" y="430" width="40" height="20" fill="#cbd5e1"/>
  <rect x="370" y="450" width="120" height="6" fill="#94a3b8"/>
  <!-- Screen content -->
  <rect x="365" y="335" width="130" height="80" rx="4" fill="#f1f5f9"/>
  <rect x="375" y="350" width="50" height="8" rx="4" fill="#38bdf8"/>
  <rect x="375" y="370" width="100" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="375" y="385" width="80" height="6" rx="3" fill="#cbd5e1"/>

  <!-- Floating Elements -->
  <!-- Medical Cross -->
  <g transform="translate(650, 100)">
    <rect x="20" y="0" width="16" height="56" rx="8" fill="#10b981"/>
    <rect x="0" y="20" width="56" height="16" rx="8" fill="#10b981"/>
  </g>
  
  <!-- Abstract health chart -->
  <rect x="80" y="150" width="120" height="100" rx="16" fill="#ffffff" filter="url(#softShadow)"/>
  <path d="M100,220 L120,220 L135,180 L155,230 L170,200 L180,200" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

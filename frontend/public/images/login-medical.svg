<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <clipPath id="circleClip">
      <circle cx="300" cy="300" r="280"/>
    </clipPath>
  </defs>

  <!-- Background Base -->
  <circle cx="300" cy="300" r="280" fill="#e0f2fe"/>
  <circle cx="300" cy="300" r="240" fill="#f0f9ff"/>

  <g clip-path="url(#circleClip)">
    <!-- Abstract medical elements / tech nodes -->
    <path d="M 50 150 L 550 150" stroke="#bae6fd" stroke-width="4" stroke-dasharray="10 10"/>
    <path d="M 50 450 L 550 450" stroke="#bae6fd" stroke-width="4" stroke-dasharray="10 10"/>
    
    <!-- Heart beat line -->
    <path d="M 100 250 L 150 250 L 170 200 L 200 320 L 220 250 L 500 250" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Human professional figure -->
    <path d="M 220 600 C 220 480 260 400 300 400 C 340 400 380 480 380 600 Z" fill="#ffffff" filter="url(#softShadow)"/>
    <path d="M 260 600 L 300 450 L 340 600" fill="none" stroke="#e2e8f0" stroke-width="6"/> <!-- Coat details -->
    
    <circle cx="300" cy="340" r="50" fill="#fcd34d"/> <!-- Head -->
    <path d="M 255 340 C 255 290 300 270 345 340" fill="#0f172a"/> <!-- Hair -->
    
    <!-- Stethoscope -->
    <path d="M 260 410 C 260 460 340 460 340 410" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M 300 448 L 300 520" fill="none" stroke="#334155" stroke-width="8"/>
    <circle cx="300" cy="530" r="14" fill="#334155"/>
    
    <!-- Floating medical cards -->
    <rect x="360" y="280" width="120" height="80" rx="12" fill="#ffffff" filter="url(#softShadow)"/>
    <rect x="380" y="300" width="40" height="8" rx="4" fill="#10b981"/>
    <rect x="380" y="320" width="80" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="380" y="335" width="60" height="6" rx="3" fill="#e2e8f0"/>

    <rect x="120" y="320" width="100" height="100" rx="16" fill="#ffffff" filter="url(#softShadow)"/>
    <circle cx="170" cy="360" r="20" fill="#e0f2fe"/>
    <path d="M 170 345 L 170 375 M 155 360 L 185 360" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <rect x="140" y="395" width="60" height="6" rx="3" fill="#e2e8f0"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background shapes -->
  <circle cx="200" cy="40" r="20" fill="#aed581" opacity="0.3"/>
  <circle cx="40" cy="150" r="30" fill="#64b5f6" opacity="0.2"/>
  <circle cx="180" cy="160" r="12" fill="#81c784" opacity="0.4"/>
  
  <!-- Shield -->
  <path d="M120 20 L180 45 L180 110 C180 160 120 185 120 185 C120 185 60 160 60 110 L60 45 Z" fill="url(#shieldGrad)" filter="url(#shadow)"/>
  
  <!-- Cross -->
  <rect x="105" y="65" width="30" height="80" rx="6" fill="#1976d2"/>
  <rect x="80" y="90" width="80" height="30" rx="6" fill="#1976d2"/>
  
  <!-- Heartbeat line -->
  <path d="M70 105 L95 105 L105 80 L125 140 L135 105 L170 105" fill="none" stroke="#4caf50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
